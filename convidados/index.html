<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chamada — Convidados DOC</title>
<style>
:root{--carvao:#15100D;--noite:#0B0806;--laranja:#F05A14;--brasa:#FF7A2F;
--areia:#EFE9E2;--card:#FFFFFF;--fumaca:#9A8E85;--tinta:#1A1512;--linha:#D6CDC3;--sombra:#7A6A5E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--areia);color:var(--tinta);font-size:17px;line-height:1.35;overscroll-behavior:none;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.curvas{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}

#gate{position:fixed;inset:0;background:var(--noite);color:var(--areia);display:flex;flex-direction:column;
justify-content:center;padding:30px 24px;z-index:50;overflow:hidden}
#gate .in{position:relative;z-index:2}
.gate-mark{position:absolute;top:calc(20px + env(safe-area-inset-top));right:20px;width:46px;height:auto;z-index:3;opacity:.92}
#gate .ahu{font-size:13px;font-weight:800;letter-spacing:.34em;color:var(--laranja);margin-bottom:14px}
#gate h1{font-size:34px;line-height:1.02;font-weight:800;margin:0 0 8px;letter-spacing:-.03em}
#gate p.sub{margin:0 0 8px;color:var(--fumaca);font-size:15px;line-height:1.45}
#gate .rule{height:3px;width:52px;background:var(--laranja);margin:20px 0 6px}
#gate label{display:block;font-size:14px;color:var(--fumaca);margin:18px 0 6px}
#gate input{width:100%;padding:15px;border-radius:4px;border:1px solid #3A2E26;background:#1A1411;
color:var(--areia);font-size:17px}
#gate input:focus{outline:2px solid var(--laranja);outline-offset:1px;border-color:transparent}
#gate input[type=date]{color-scheme:dark;min-height:52px}
.ev-nome{margin-top:12px;font-size:14px;color:var(--fumaca)}
.ev-nome b{color:var(--laranja);font-weight:700;font-variant-numeric:tabular-nums}
.ev-fixo{margin-top:22px;padding:14px 16px;border-left:3px solid var(--laranja);background:#1A1411}
.ev-fixo span{display:block;font-size:12px;color:var(--fumaca);letter-spacing:.12em;margin-bottom:3px}
.ev-fixo b{display:block;font-size:19px;color:var(--areia);font-weight:700;font-variant-numeric:tabular-nums}
.ev-fixo i{display:block;font-style:normal;font-size:13px;color:var(--laranja);margin-top:3px}
#gate button{margin-top:28px;width:100%;padding:17px;border-radius:4px;background:var(--laranja);
color:#fff;font-weight:800;font-size:17px;letter-spacing:.01em}

header{position:sticky;top:0;z-index:20;background:var(--carvao);color:var(--areia);
padding:11px 14px 13px;overflow:hidden;box-shadow:0 3px 14px rgba(11,8,6,.3)}
header .hd{position:relative;z-index:2}
.hrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.count{font-size:34px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
line-height:1;color:var(--brasa)}
.count small{font-size:13px;font-weight:600;color:var(--fumaca);margin-left:7px;letter-spacing:0}
.who{margin-left:auto;font-size:12px;color:var(--fumaca);text-align:right;max-width:48%;line-height:1.3}
.who em{font-style:normal;display:block;color:var(--laranja);font-weight:600}
.search{display:flex;align-items:center;background:#241C17;border:1px solid #3A2E26;border-radius:4px;padding:0 10px}
.search input{flex:1;border:none;background:none;padding:13px 4px;font-size:17px;outline:none;
min-width:0;color:var(--areia)}
.search input::placeholder{color:#6E635B}
.search button{color:var(--fumaca);padding:8px;font-size:19px}
.tabs{display:flex;gap:0;margin-top:11px;border-bottom:1px solid #3A2E26}
.tabs button{flex:1;padding:9px 0 8px;color:var(--fumaca);font-size:13.5px;font-weight:600;
border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--areia);border-bottom-color:var(--laranja)}

#list{padding:9px 12px 132px}
.row{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:4px;
padding:11px 13px 11px 11px;margin-bottom:6px;border-left:4px solid var(--linha)}
.row.on{border-left-color:var(--laranja);background:#FDF4EC}
.lgnd{flex:none;width:58px;font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;
color:var(--sombra);letter-spacing:-.02em;line-height:1.1}
.lgnd b{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--linha)}
.row.on .lgnd{color:var(--laranja)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:16.5px;letter-spacing:-.012em}
.row .nm span{display:block;font-size:12.5px;color:var(--sombra);margin-top:2px}
.row .nm u{text-decoration:none;color:var(--laranja);font-weight:700}
.row .nm i{font-style:normal;font-variant-numeric:tabular-nums}
.mark{width:44px;height:44px;flex:none;border-radius:4px;border:2px solid var(--linha);display:flex;
align-items:center;justify-content:center;font-size:21px;color:var(--linha)}
.row.on .mark{background:var(--laranja);border-color:var(--laranja);color:#fff}
.time{font-size:12px;color:var(--laranja);font-weight:800;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--sombra);padding:46px 24px;font-size:15px}
.empty button{display:block;margin:16px auto 0;background:var(--carvao);color:var(--areia);
padding:13px 22px;border-radius:4px;font-weight:700}

footer{position:fixed;bottom:0;left:0;right:0;background:var(--areia);border-top:1px solid var(--linha);
padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20}
footer button{flex:1;padding:14px 6px;border-radius:4px;font-weight:800;font-size:15px}
.b-save{background:var(--laranja);color:#fff}
.b-add{background:transparent;color:var(--carvao);border:1.5px solid var(--carvao)}

.veil{position:fixed;inset:0;background:rgba(11,8,6,.62);display:none;align-items:flex-end;z-index:40}
.veil.show{display:flex}
.sheet{background:var(--areia);width:100%;border-radius:10px 10px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));
border-top:4px solid var(--laranja)}
.sheet h2{margin:0 0 4px;font-size:21px;letter-spacing:-.025em;font-weight:800}
.sheet p{margin:0 0 16px;font-size:14px;color:var(--sombra);line-height:1.4}
.sheet input{width:100%;padding:14px;border:1px solid var(--linha);border-radius:4px;background:#fff;
margin-bottom:10px;font-size:17px}
.sheet .acts{display:flex;gap:8px;margin-top:6px}
.sheet .acts button{flex:1;padding:15px;border-radius:4px;font-weight:800}
.pri{background:var(--laranja);color:#fff}
.sec{background:transparent;color:var(--sombra);border:1px solid var(--linha)}
.warn{background:#8A2B08;color:#fff;font-size:13px;padding:10px 14px;line-height:1.3;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--carvao);color:var(--areia);
padding:12px 20px;border-radius:4px;font-size:14px;z-index:45;opacity:0;transition:opacity .18s;
pointer-events:none;max-width:88%;text-align:center;border-left:3px solid var(--laranja)}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#splash{position:fixed;inset:0;background:var(--noite);display:flex;align-items:center;
justify-content:center;z-index:60;transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
.sp-in{text-align:center;padding:0 24px}
.emb{width:238px;max-width:64vw;height:auto;display:block;margin:0 auto}
.sp-bem{margin-top:20px;font-size:19px;font-weight:700;color:var(--areia);letter-spacing:-.015em}
.sp-nome{margin-top:6px;font-size:29px;font-weight:800;letter-spacing:-.025em;color:var(--laranja)}
.sp-sub{margin-top:4px;font-size:13px;color:var(--fumaca)}
.mini{width:27px;height:auto;flex:none;display:block;margin-left:9px;align-self:flex-start}

.g-rec{display:block;width:100%;margin:14px 0 0;padding:9px 0;background:none;border:0;
 color:#9A8E85;font-size:12.5px;font-weight:600;letter-spacing:.02em;text-decoration:underline;
 text-underline-offset:3px;cursor:pointer;font-family:inherit}
.g-rec:active{color:#F05A14}
.recp{margin-top:10px;background:rgba(255,255,255,.07);border-radius:4px;padding:10px 12px}
.rec-nd{margin:0 0 8px;color:#9A8E85;font-size:12.5px;line-height:1.4}
.rec-it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.1)}
.rec-it:first-of-type{border-top:0}
.rec-it div{flex:1;min-width:0}
.rec-it b{display:block;font-size:14px;color:#EFE9E2;font-weight:700;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.rec-it span{display:block;font-size:11.5px;color:#9A8E85;margin-top:1px}
.rec-it button{flex:0 0 auto;background:#F05A14;color:#15100D;border:0;border-radius:3px;
 padding:7px 13px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}

.s-wn{margin:2px 0 10px;padding:9px 11px;background:#FDE3D2;color:#8A2B08;
 border-radius:4px;font-size:13.5px;line-height:1.35;font-weight:600}

.g-lista{margin:6px 0 0;font-size:12.5px;color:var(--fumaca)}
.g-vazio{margin:14px 0 0;padding:12px 14px;background:#8A2B08;color:#fff;border-radius:4px;
 font-size:14px;line-height:1.4;font-weight:600}
.g-vazio b{display:block;font-size:15.5px;margin-bottom:4px}
</style>

5P28tqoQh/xU9QiroUre/yUcLfhBYjDtNg7IzOV4vIFWVpV472anj8p/+J5oP8KJRjUm0l0PlJTpMndbTmDU46s+8jac/uOBObDmfYUjcUrbNCPsdv83cdToHBjLfQxWZOVEMvjj5eUPB/sxTodxwG4ETm1G57+9fMNQb8Ep8HcHNP1zVIM3+p/+922wt+IQuAx7BwyUZ7pBsv3lG4d5Kw5ReDuoNAw2m0BhV7/9BOxncOp3Dqj/IkVhv//EED+Dc8B/+L7C/gHXv73+qQF+Dqc2/PKJT6z8Bdh+/x/LSEQnZHy9wgAAAABJRU5ErkJggg==">

<main id="list"></main>

<footer>
  <button class="b-add" id="b-add">Não está na lista</button>
  <button class="b-save" id="b-save">Salvar arquivo</button>
</footer>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){var s=document.getElementById('splash');
 setTimeout(function(){s.classList.add('off');setTimeout(function(){s.remove()},600)},1900);
 s.onclick=function(){s.remove()};})();
const DADOS = [];
// [id, nome, cpf, lgnd, familia, top, semTelefone]
const N=0,NOME=1,CPF=2,LGND=3,FAM=4,TOP=5,FALTA=6;
const F_TEL=1,F_LGND=2,F_FAM=4;

const LISTA_EM='';
let state={op:'',ev:'',pres:{},extra:[]};
let filtro='all', busca='', memOnly=false;

const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const HAY_T=DADOS.map(r=>norm(r[NOME]));
// o app so conhece os 3 ultimos digitos; buscar por eles separa homonimos
const HAY_D=DADOS.map(r=>r[CPF]);
const $=id=>document.getElementById(id);
const cpfFmt=c=>c?c.slice(0,3)+'.'+c.slice(3,6)+'.'+c.slice(6,9)+'-'+c.slice(9):'';

function chave(){return 'convidados::'+norm(state.ev).replace(/\s+/g,'-')}
function salvar(){
  if(memOnly) return false;
  try{ localStorage.setItem(chave(),JSON.stringify(state)); return true; }
  catch(e){ memOnly=true; avisar(); return false; }
}
function avisar(){
  $('warn').style.display='block';
  $('warn').textContent='Este celular não está guardando os dados sozinho. Toque em "Salvar arquivo" a cada 15 check-ins.';
}
function carregar(ev){
  try{ const v=localStorage.getItem('convidados::'+norm(ev).replace(/\s+/g,'-')); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ memOnly=true; }

// A lista vive DENTRO deste arquivo e o service worker guarda o arquivo.
// Se o operador instalar o app antes de a lista subir e depois abrir sem
// internet, ele fica com a versao vazia e a conferencia falha em silencio.
// Entao o app diz, na cara, de quando e a lista que ele tem.
(function(){
  const l=document.getElementById('g-lista'), v=document.getElementById('g-vazio');
  if(l) l.textContent = LISTA_EM ? ('Lista gerada em ' + LISTA_EM) : '';
  if(v && !DADOS.length){
    v.style.display='block';
    v.innerHTML='<b>Este aparelho está com a LISTA VAZIA</b>'+
      'Conecte à internet e abra o aplicativo de novo para baixar a lista. '+
      'Sem isso não dá para conferir ninguém.';
  }
})();

function nomeEvento(){
  const nm=$('g-ev').value.trim(), v=$('g-dt').value;
  if(!nm||!v) return '';
  const p=v.split('-');
  return nm+' '+p[2]+'/'+p[1]+'/'+p[0];
}
function mostrarEvento(){
  $('g-ev-txt').textContent = nomeEvento() || '—';
}
['change','input'].forEach(e=>{
  $('g-dt').addEventListener(e, mostrarEvento);
  $('g-ev').addEventListener(e, mostrarEvento);
});

$('g-go').onclick=()=>{
  const op=$('g-op').value.trim(), ev=nomeEvento();
  if(!op){ toast('Escreva o seu nome'); return; }
  if(!ev){ toast('Evento não definido — abra pelo link que o responsável enviou'); return; }
  try{ localStorage.setItem('convidados::ultimo-evento', $('g-ev').value.trim()); }catch(e){}
  const ant=carregar(ev);
  state = ant ? Object.assign(ant,{op}) : {op,ev,pres:{},extra:[]};
  $('gate').style.display='none';
  if(memOnly) avisar();
  salvar(); render();
};
function lerConfig(){
  const q=new URLSearchParams(location.search);
  const e=(q.get('e')||'').trim(), d=(q.get('d')||'').trim(), hr=(q.get('h')||'').trim();
  if(e && /^\d{4}-\d{2}-\d{2}$/.test(d)){
    const c={e,d,h:hr};
    try{ localStorage.setItem('convidados::evento-config', JSON.stringify(c)) }catch(err){}
    return c;
  }
  try{ const v=localStorage.getItem('convidados::evento-config'); if(v) return JSON.parse(v); }catch(err){}
  return null;
}
(function(){
  const d=new Date(), z=n=>String(n).padStart(2,'0');
  const cfg=lerConfig();
  if(cfg){
    $('g-ev').value=cfg.e;
    $('g-dt').value=cfg.d;
    $('g-conf').style.display='none';
    $('g-fixo').style.display='block';
    $('g-fixo-nm').textContent=nomeEvento();
    $('g-fixo-hr').textContent=cfg.h ? 'Início às '+cfg.h : '';
  }else{
    $('g-dt').value=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
    let ult='RPM';
    try{ ult=localStorage.getItem('convidados::ultimo-evento')||'RPM'; }catch(e){}
    $('g-ev').value=ult;
  }
  mostrarEvento();
})();

$('q').addEventListener('input',e=>{busca=e.target.value.trim();render()});
$('qx').onclick=()=>{$('q').value='';busca='';render();$('q').focus()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  filtro=b.dataset.f;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  render();
});

function hora(ts){const d=new Date(ts),z=n=>String(n).padStart(2,'0');return z(d.getHours())+':'+z(d.getMinutes())}

function bate(r,termos){
  const i=r[N];
  const t = (i<DADOS.length&&DADOS[i]===r) ? HAY_T[i] : norm(r[NOME]);
  const d = (i<DADOS.length&&DADOS[i]===r) ? HAY_D[i] : '';
  return termos.every(x => x.dig ? d.includes(x.v) : t.includes(x.v));
}
function tokens(q){
  return norm(q).split(/\s+/).filter(Boolean).map(v=>{
    const so=v.replace(/[.\-\/]/g,'');
    return /^\d+$/.test(so) ? {dig:true,v:so} : {dig:false,v};
  });
}

function render(){
  const L=$('list'), termos=busca?tokens(busca):[];
  let out=[];
  // O contador conta TODAS as presencas do estado. Antes ele era somado
  // dentro deste laco, que para em 250 linhas: com 2.293 cadastrados o
  // numero so refletia quem caia nas primeiras 250, e visitante nenhum,
  // porque visitante entra no fim da lista.
  const n=Object.keys(state.pres).length;
  const todos=DADOS.concat(state.extra.map(x=>[x.id,x.nome,x.cpf||'',x.lgnd||'','','avulso',x.tel?0:1]));
  for(const r of todos){
    const on=!!state.pres[r[N]];
    if(filtro==='on'&&!on) continue;
    if(filtro==='off'&&on) continue;
    if(termos.length&&!bate(r,termos)) continue;
    out.push(linha(r,on));
    if(out.length>=250) break;
  }
  $('c-n').textContent=n;
  $('c-who').innerHTML=esc(state.op)+' · '+esc(state.ev)+
    (memOnly?'':'<em>salvo neste aparelho</em>');
  L.innerHTML = out.length ? out.join('') :
    '<div class="empty">Ninguém encontrado.<button id="e-add">Cadastrar como visitante</button></div>';
  if(!out.length) $('e-add').onclick=()=>abrirNovo(busca);
  L.querySelectorAll('.row').forEach(el=>el.onclick=()=>toggle(el.dataset.id));
}

function faltam(r){
  const f=r[FALTA]|0, l=[];
  // Convidado nao tem nº LGND nem familia: a unica pendencia possivel
  // e o telefone. Sem isso o app pediria a todos um numero que nao existe.
  if(f&F_TEL) l.push('telefone');
  return l;
}
function linha(r,on){
  const fl=faltam(r);
  const info=[ r[CPF]?'<i>CPF ···'+String(r[CPF]).slice(-3)+'</i>':'',
    r[TOP]==='avulso'?'Fora da lista':'',
    fl.length?'<u>falta '+fl.join(', ')+'</u>':'' ].filter(Boolean).join('   ');
  const t=on?'<div class="time">'+hora(state.pres[r[N]].ts)+'</div>':'';
  return '<div class="row'+(on?' on':'')+'" data-id="'+r[N]+'">'+
    '<div class="nm"><b>'+esc(r[NOME])+'</b><span>'+info+'</span></div>'+
    t+'<div class="mark">'+(on?'✓':'')+'</div></div>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function achar(id){
  id=Number(id);
  if(DADOS[id]&&DADOS[id][N]===id) return DADOS[id];
  const e=state.extra.find(x=>x.id===id);
  return [e.id,e.nome,e.cpf||'',e.lgnd||'','','avulso',e.tel?0:1];
}
function toggle(id){
  const r=achar(id);
  if(state.pres[id]){
    confirmar('Remover presença?', esc(r[NOME])+' foi marcado às '+hora(state.pres[id].ts)+'.',
      'Remover','Manter',()=>{delete state.pres[id];salvar();render();toast('Presença removida')});
    return;
  }
  if(r[TOP]!=='avulso' && faltam(r).length){ completar(id,r); return; }
  marcar(id);
}
function marcar(id,dados){
  state.pres[id]={ts:Date.now(),op:state.op};
  if(dados&&typeof dados==='object'){
    if(dados.tel) state.pres[id].tel=dados.tel;
    if(dados.lgnd) state.pres[id].lgnd=dados.lgnd;
    if(dados.fam) state.pres[id].fam=dados.fam;
  }else if(dados){ state.pres[id].tel=dados; }
  const ok=salvar(); render();
  const c=Object.keys(state.pres).length;
  toast(ok ? 'Registrado e salvo · '+c+' no total' : 'Registrado · '+c+' — SALVE O ARQUIVO');
}

function completar(id,r){
  const fl=faltam(r);
  let campos='';
  if(fl.indexOf('telefone')>=0) campos+='<input id="c-tel" type="tel" inputmode="numeric" placeholder="Celular com DDD">';
  if(fl.indexOf('nº LGND')>=0) campos+='<input id="c-lgnd" type="tel" inputmode="numeric" placeholder="Número LGND">';
  if(fl.indexOf('família')>=0) campos+='<input id="c-fam" type="tel" inputmode="numeric" placeholder="Família">';
  $('sheet').innerHTML='<h2>'+esc(r[NOME])+'</h2>'+
    '<p>Está na lista, mas falta '+fl.join(', ')+'. Pergunte ao convidado e complete — é assim que a lista fica inteira.</p>'+
    campos+
    '<div class="acts"><button class="sec" id="c-pula">Não informou</button>'+
    '<button class="pri" id="c-ok">Registrar presença</button></div>';
  abrir();
  setTimeout(()=>{const p=$('sheet').querySelector('input'); if(p) p.focus();},120);
  const pegar=()=>{
    const d={};
    if($('c-tel')&&$('c-tel').value.replace(/\D/g,'')) d.tel=$('c-tel').value.replace(/\D/g,'');
    if($('c-lgnd')&&$('c-lgnd').value.replace(/\D/g,'')) d.lgnd=$('c-lgnd').value.replace(/\D/g,'');
    if($('c-fam')&&$('c-fam').value.replace(/\D/g,'')) d.fam=$('c-fam').value.replace(/\D/g,'');
    return d;
  };
  $('c-ok').onclick=()=>{ const d=pegar(); fechar(); marcar(id,d) };
  $('c-pula').onclick=()=>{ fechar(); marcar(id) };
}

function abrirNovo(pre){
  const d=/^\d/.test(pre||'');
  $('sheet').innerHTML='<h2>Fora da lista</h2><p>Para quem não está na relação de convidados.</p>'+
    '<input id="s-nm" placeholder="Nome completo" value="'+esc(d?'':(pre||''))+'">'+
    '<input id="s-cp" type="tel" inputmode="numeric" placeholder="CPF" value="'+esc(d?pre:'')+'">'+
    '<input id="s-tl" type="tel" inputmode="numeric" placeholder="Celular com DDD">'+
    '<div class="acts"><button class="sec" id="s-c">Cancelar</button>'+
    '<button class="pri" id="s-a">Adicionar e marcar</button></div>';
  abrir(); setTimeout(()=>$('s-nm').focus(),120);
  $('s-c').onclick=fechar;
  let semCpf=false;
  $('s-a').onclick=()=>{
    const nm=$('s-nm').value.trim(); if(!nm){toast('Escreva o nome');return}
    const cp=$('s-cp').value.replace(/\D/g,'');
    // O CPF e a chave que identifica o irmao na matriz. Sem ele, o mesmo
    // visitante cadastrado por dois operadores entra duas vezes. Nao bloqueia
    // a chamada - avisa e pede um segundo toque.
    if(cp.length!==11 && !semCpf){
      semCpf=true;
      $('s-a').textContent='Cadastrar sem CPF';
      let w=document.getElementById('s-wn');
      if(!w){ w=document.createElement('p'); w.id='s-wn'; w.className='s-wn';
        $('s-a').parentNode.parentNode.insertBefore(w,$('s-a').parentNode); }
      w.textContent = cp.length
        ? 'CPF incompleto. E o CPF que identifica o convidado: sem ele certo, ele pode entrar duplicado na lista. Toque de novo para seguir assim.'
        : 'Sem CPF o convidado pode entrar duplicado na lista, porque e o CPF que identifica. Toque de novo para seguir assim.';
      return;
    }
    const id=900000+state.extra.length;
    state.extra.push({id,nome:nm,cpf:cp,lgnd:'',
                      tel:$('s-tl').value.replace(/\D/g,'')});
    fechar(); $('q').value=''; busca=''; marcar(id);
  };
}
function confirmar(t,d,sim,nao,fn){
  $('sheet').innerHTML='<h2>'+t+'</h2><p>'+d+'</p><div class="acts">'+
    '<button class="sec" id="s-n">'+nao+'</button><button class="pri" id="s-y">'+sim+'</button></div>';
  abrir(); $('s-n').onclick=fechar; $('s-y').onclick=()=>{fechar();fn()};
}
function abrir(){$('veil').classList.add('show')}
function fechar(){$('veil').classList.remove('show')}
$('veil').onclick=e=>{if(e.target===$('veil'))fechar()};
$('b-add').onclick=()=>abrirNovo('');

let tt;
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),2200)}

function baixarPack(st){
  const op = st.op || 'recuperado';
  const pack={app:'convidados-checkin',v:3,evento:st.ev,operador:op,
    gerado:new Date().toISOString(),presencas:st.pres||{},visitantes:st.extra||[]};
  const nome='convidados_'+norm(String(st.ev)).replace(/[^a-z0-9]+/g,'-')+'_'+norm(String(op)).replace(/[^a-z0-9]+/g,'-')+'.json';
  const b=new Blob([JSON.stringify(pack)],{type:'application/json'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u;a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
  return Object.keys(st.pres||{}).length+' presenças salvas em '+nome;
}
$('b-save').onclick=()=>{ toast(baixarPack(state)); };

const PREFIXO='convidados::';
/* Recuperacao: le tudo que este aparelho guardou sob convidados::
   e permite exportar qualquer evento antigo. So le e baixa; nao apaga nada. */
const escT=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('g-rec').onclick=()=>{
  const p=$('g-recp');
  if(p.style.display==='block'){ p.style.display='none'; return; }
  const itens=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k || k.indexOf(PREFIXO)!==0) continue;
      if(k==='convidados::evento-config' || k==='convidados::ultimo-evento') continue;
      let d=null; try{ d=JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
      if(!d || !d.pres) continue;
      itens.push({ev:d.ev||k.slice(PREFIXO.length).replace(/-/g,' '), op:d.op||'',
                  n:Object.keys(d.pres).length, x:(d.extra||[]).length, d:d});
    }
  }catch(e){}
  if(!itens.length){
    p.innerHTML='<p class="rec-nd">Nada guardado neste aparelho. Se a chamada foi feita em outro celular, ou se os dados do navegador foram limpos, não há o que recuperar aqui.</p>';
    p.style.display='block'; return;
  }
  itens.sort((a,b)=>b.n-a.n);
  p.innerHTML='<p class="rec-nd">Guardado neste aparelho. Baixe e envie ao responsável.</p>'+
    itens.map((it,i)=>'<div class="rec-it"><div><b>'+escT(it.ev)+'</b><span>'+it.n+
      ' presença'+(it.n===1?'':'s')+(it.x?' · '+it.x+' visitante'+(it.x===1?'':'s'):'')+
      (it.op?' · '+escT(it.op):'')+'</span></div><button type="button" data-i="'+i+'">Baixar</button></div>').join('');
  p.style.display='block';
  p.querySelectorAll('button[data-i]').forEach(b=>{
    b.onclick=()=>{ toast(baixarPack(itens[+b.getAttribute('data-i')].d)); };
  });
};
window.addEventListener('beforeunload',e=>{
  if(Object.keys(state.pres).length){e.preventDefault();e.returnValue=''}
});
</script>

  });
