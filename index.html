<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chamada — Sentinelas da Amazônia</title>
<style>
:root{--carvao:#15100D;--noite:#0B0806;--laranja:#F05A14;--brasa:#FF7A2F;
--areia:#EFE9E2;--card:#FFFFFF;--fumaca:#9A8E85;--tinta:#1A1512;--linha:#D6CDC3;--sombra:#7A6A5E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--areia);color:var(--tinta);font-size:17px;line-height:1.35;overscroll-behavior:none;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.curvas{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}

#gate{position:fixed;inset:0;background:var(--noite);color:var(--areia);display:flex;flex-direction:column;
justify-content:center;padding:30px 24px;z-index:50;overflow:hidden}
#gate .in{position:relative;z-index:2}
.gate-mark{position:absolute;top:calc(20px + env(safe-area-inset-top));right:20px;width:46px;height:auto;z-index:3;opacity:.92}
#gate .ahu{font-size:13px;font-weight:800;letter-spacing:.34em;color:var(--laranja);margin-bottom:14px}
#gate h1{font-size:34px;line-height:1.02;font-weight:800;margin:0 0 8px;letter-spacing:-.03em}
#gate p.sub{margin:0 0 8px;color:var(--fumaca);font-size:15px;line-height:1.45}
#gate .rule{height:3px;width:52px;background:var(--laranja);margin:20px 0 6px}
#gate label{display:block;font-size:14px;color:var(--fumaca);margin:18px 0 6px}
#gate input{width:100%;padding:15px;border-radius:4px;border:1px solid #3A2E26;background:#1A1411;
color:var(--areia);font-size:17px}
#gate input:focus{outline:2px solid var(--laranja);outline-offset:1px;border-color:transparent}
#gate button{margin-top:28px;width:100%;padding:17px;border-radius:4px;background:var(--laranja);
color:#fff;font-weight:800;font-size:17px;letter-spacing:.01em}

header{position:sticky;top:0;z-index:20;background:var(--carvao);color:var(--areia);
padding:11px 14px 13px;overflow:hidden;box-shadow:0 3px 14px rgba(11,8,6,.3)}
header .hd{position:relative;z-index:2}
.hrow{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.count{font-size:34px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
line-height:1;color:var(--brasa)}
.count small{font-size:13px;font-weight:600;color:var(--fumaca);margin-left:7px;letter-spacing:0}
.who{margin-left:auto;font-size:12px;color:var(--fumaca);text-align:right;max-width:48%;line-height:1.3}
.who em{font-style:normal;display:block;color:var(--laranja);font-weight:600}
.search{display:flex;align-items:center;background:#241C17;border:1px solid #3A2E26;border-radius:4px;padding:0 10px}
.search input{flex:1;border:none;background:none;padding:13px 4px;font-size:17px;outline:none;
min-width:0;color:var(--areia)}
.search input::placeholder{color:#6E635B}
.search button{color:var(--fumaca);padding:8px;font-size:19px}
.tabs{display:flex;gap:0;margin-top:11px;border-bottom:1px solid #3A2E26}
.tabs button{flex:1;padding:9px 0 8px;color:var(--fumaca);font-size:13.5px;font-weight:600;
border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--areia);border-bottom-color:var(--laranja)}

#list{padding:9px 12px 132px}
.row{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:4px;
padding:11px 13px 11px 11px;margin-bottom:6px;border-left:4px solid var(--linha)}
.row.on{border-left-color:var(--laranja);background:#FDF4EC}
.lgnd{flex:none;width:58px;font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;
color:var(--sombra);letter-spacing:-.02em;line-height:1.1}
.lgnd b{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--linha)}
.row.on .lgnd{color:var(--laranja)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:16.5px;letter-spacing:-.012em}
.row .nm span{display:block;font-size:12.5px;color:var(--sombra);margin-top:2px}
.row .nm i{font-style:normal;font-variant-numeric:tabular-nums}
.mark{width:44px;height:44px;flex:none;border-radius:4px;border:2px solid var(--linha);display:flex;
align-items:center;justify-content:center;font-size:21px;color:var(--linha)}
.row.on .mark{background:var(--laranja);border-color:var(--laranja);color:#fff}
.time{font-size:12px;color:var(--laranja);font-weight:800;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--sombra);padding:46px 24px;font-size:15px}
.empty button{display:block;margin:16px auto 0;background:var(--carvao);color:var(--areia);
padding:13px 22px;border-radius:4px;font-weight:700}

footer{position:fixed;bottom:0;left:0;right:0;background:var(--areia);border-top:1px solid var(--linha);
padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20}
footer button{flex:1;padding:14px 6px;border-radius:4px;font-weight:800;font-size:15px}
.b-save{background:var(--laranja);color:#fff}
.b-add{background:transparent;color:var(--carvao);border:1.5px solid var(--carvao)}

.veil{position:fixed;inset:0;background:rgba(11,8,6,.62);display:none;align-items:flex-end;z-index:40}
.veil.show{display:flex}
.sheet{background:var(--areia);width:100%;border-radius:10px 10px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));
border-top:4px solid var(--laranja)}
.sheet h2{margin:0 0 4px;font-size:21px;letter-spacing:-.025em;font-weight:800}
.sheet p{margin:0 0 16px;font-size:14px;color:var(--sombra);line-height:1.4}
.sheet input{width:100%;padding:14px;border:1px solid var(--linha);border-radius:4px;background:#fff;
margin-bottom:10px;font-size:17px}
.sheet .acts{display:flex;gap:8px;margin-top:6px}
.sheet .acts button{flex:1;padding:15px;border-radius:4px;font-weight:800}
.pri{background:var(--laranja);color:#fff}
.sec{background:transparent;color:var(--sombra);border:1px solid var(--linha)}
.warn{background:#8A2B08;color:#fff;font-size:13px;padding:10px 14px;line-height:1.3;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--carvao);color:var(--areia);
padding:12px 20px;border-radius:4px;font-size:14px;z-index:45;opacity:0;transition:opacity .18s;
pointer-events:none;max-width:88%;text-align:center;border-left:3px solid var(--laranja)}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#splash{position:fixed;inset:0;background:var(--noite);display:flex;align-items:center;
justify-content:center;z-index:60;transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
.sp-in{text-align:center;padding:0 24px}
.emb{width:238px;max-width:64vw;height:auto;display:block;margin:0 auto}
.sp-bem{margin-top:20px;font-size:19px;font-weight:700;color:var(--areia);letter-spacing:-.015em}
.sp-nome{margin-top:6px;font-size:29px;font-weight:800;letter-spacing:-.025em;color:var(--laranja)}
.sp-sub{margin-top:4px;font-size:13px;color:var(--fumaca)}
.mini{width:27px;height:auto;flex:none;display:block;margin-left:9px;align-self:flex-start}
</style>

19,"Yann Victor Monteiro Leite","01275436277","182066","20","1104",0],[2220,"Ygor Yann De Souza Gomes","01565264258","181976","14","1104",0],[2221,"Yuri Albuquerque Santos","95183850259","85927","1","928",0],[2222,"Yuri Araújo De Queiroz","02233595211","","3","744",1],[2223,"Yuri Carlos De Oliveira Motta","00032963262","128409","22","1007",0],[2224,"Yuri Costa De Aquino","02217433245","220847","11","1681",0],[2225,"Yuri Pelaes Brito","99807696291","127890","8","1007",0],[2226,"Yuri Rodrigues Campos","97442194249","85858","8","786",1],[2227,"Yuri Samuel Reis Vilarins","06488230247","128276","15","1007",0],[2228,"Yverson Rodrigo Oliveira Silva","94740445204","85826","6","786",1],[2229,"Zacarias Barbosa Monteiro","70700907220","150727","3","1104",0],[2230,"Zaqueu Gemaque Galeno Filho","05365972279","181932","11","1104",0],[2231,"Zefilho Cruz","96374543220","106277","3","928",0],[2232,"Zenonn De Moura E Silva","98746600230","","","1495",0],[2233,"Zildomar Da Silva Campelo","23667192215","106400","11","928",0]];
// [id, nome, cpf, lgnd, familia, top, semTelefone]
const N=0,NOME=1,CPF=2,LGND=3,FAM=4,TOP=5,SEMTEL=6;

let state={op:'',ev:'',pres:{},extra:[]};
let filtro='all', busca='', memOnly=false;

const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const HAY_T=DADOS.map(r=>norm(r[NOME]));
const HAY_D=DADOS.map(r=>r[CPF]+' '+r[LGND]);
const $=id=>document.getElementById(id);
const cpfFmt=c=>c?c.slice(0,3)+'.'+c.slice(3,6)+'.'+c.slice(6,9)+'-'+c.slice(9):'';

function chave(){return 'sentinelas::'+norm(state.ev).replace(/\s+/g,'-')}
function salvar(){
  if(memOnly) return false;
  try{ localStorage.setItem(chave(),JSON.stringify(state)); return true; }
  catch(e){ memOnly=true; avisar(); return false; }
}
function avisar(){
  $('warn').style.display='block';
  $('warn').textContent='Este celular não está guardando os dados sozinho. Toque em "Salvar arquivo" a cada 15 check-ins.';
}
function carregar(ev){
  try{ const v=localStorage.getItem('sentinelas::'+norm(ev).replace(/\s+/g,'-')); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ memOnly=true; }

$('g-go').onclick=()=>{
  const op=$('g-op').value.trim(), ev=$('g-ev').value.trim();
  if(!op||!ev){ toast('Preencha os dois campos'); return; }
  const ant=carregar(ev);
  state = ant ? Object.assign(ant,{op}) : {op,ev,pres:{},extra:[]};
  $('gate').style.display='none';
  if(memOnly) avisar();
  salvar(); render();
};
(function(){ const d=new Date(), z=n=>String(n).padStart(2,'0');
  $('g-ev').value='RPM '+z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear(); })();

$('q').addEventListener('input',e=>{busca=e.target.value.trim();render()});
$('qx').onclick=()=>{$('q').value='';busca='';render();$('q').focus()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  filtro=b.dataset.f;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  render();
});

function hora(ts){const d=new Date(ts),z=n=>String(n).padStart(2,'0');return z(d.getHours())+':'+z(d.getMinutes())}

function bate(r,termos){
  const i=r[N];
  const t = (i<DADOS.length&&DADOS[i]===r) ? HAY_T[i] : norm(r[NOME]);
  const d = (i<DADOS.length&&DADOS[i]===r) ? HAY_D[i] : '';
  return termos.every(x => x.dig ? d.includes(x.v) : t.includes(x.v));
}
function tokens(q){
  return norm(q).split(/\s+/).filter(Boolean).map(v=>{
    const so=v.replace(/[.\-\/]/g,'');
    return /^\d+$/.test(so) ? {dig:true,v:so} : {dig:false,v};
  });
}

function render(){
  const L=$('list'), termos=busca?tokens(busca):[];
  let out=[], n=0;
  const todos=DADOS.concat(state.extra.map(x=>[x.id,x.nome,'','','','avulso',x.tel?0:1]));
  for(const r of todos){
    const on=!!state.pres[r[N]];
    if(on) n++;
    if(filtro==='on'&&!on) continue;
    if(filtro==='off'&&on) continue;
    if(termos.length&&!bate(r,termos)) continue;
    out.push(linha(r,on));
    if(out.length>=250) break;
  }
  $('c-n').textContent=n;
  $('c-who').innerHTML=esc(state.op)+' · '+esc(state.ev)+
    (memOnly?'':'<em>salvo neste aparelho</em>');
  L.innerHTML = out.length ? out.join('') :
    '<div class="empty">Ninguém encontrado.<button id="e-add">Cadastrar como visitante</button></div>';
  if(!out.length) $('e-add').onclick=()=>abrirNovo(busca);
  L.querySelectorAll('.row').forEach(el=>el.onclick=()=>toggle(el.dataset.id));
}

function linha(r,on){
  const info=[ r[CPF]?'<i>'+cpfFmt(r[CPF])+'</i>':'',
    r[TOP]==='avulso'?'Visitante':'TOP '+r[TOP],
    r[FAM]?'Fam. '+r[FAM]:'' ].filter(Boolean).join('   ');
  const t=on?'<div class="time">'+hora(state.pres[r[N]].ts)+'</div>':'';
  const num=r[LGND]?'<div class="lgnd"><b>LGND</b>'+r[LGND]+'</div>':'<div class="lgnd"><b>LGND</b>—</div>';
  return '<div class="row'+(on?' on':'')+'" data-id="'+r[N]+'">'+num+
    '<div class="nm"><b>'+esc(r[NOME])+'</b><span>'+info+'</span></div>'+
    t+'<div class="mark">'+(on?'✓':'')+'</div></div>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function achar(id){
  id=Number(id);
  if(DADOS[id]&&DADOS[id][N]===id) return DADOS[id];
  const e=state.extra.find(x=>x.id===id);
  return [e.id,e.nome,'','','','avulso',e.tel?0:1];
}
function toggle(id){
  const r=achar(id);
  if(state.pres[id]){
    confirmar('Remover presença?', esc(r[NOME])+' foi marcado às '+hora(state.pres[id].ts)+'.',
      'Remover','Manter',()=>{delete state.pres[id];salvar();render();toast('Presença removida')});
    return;
  }
  if(r[SEMTEL]){ pedirTelefone(id,r[NOME]); return; }
  marcar(id);
}
function marcar(id,tel){
  state.pres[id]={ts:Date.now(),op:state.op};
  if(tel) state.pres[id].tel=tel;
  const ok=salvar(); render();
  const c=Object.keys(state.pres).length;
  toast(ok ? 'Registrado e salvo · '+c+' no total' : 'Registrado · '+c+' — SALVE O ARQUIVO');
}

function pedirTelefone(id,nome){
  $('sheet').innerHTML='<h2>'+esc(nome)+'</h2><p>Não temos o celular dele no cadastro. Peça agora — é assim que a base fica completa.</p>'+
    '<input id="s-tel" type="tel" inputmode="numeric" placeholder="(91) 9 8888-7777">'+
    '<div class="acts"><button class="sec" id="s-skip">Sem telefone</button>'+
    '<button class="pri" id="s-ok">Registrar presença</button></div>';
  abrir(); setTimeout(()=>$('s-tel').focus(),120);
  $('s-ok').onclick=()=>{const t=$('s-tel').value.replace(/\D/g,'');fechar();marcar(id,t||null)};
  $('s-skip').onclick=()=>{fechar();marcar(id)};
}
function abrirNovo(pre){
  const d=/^\d/.test(pre||'');
  $('sheet').innerHTML='<h2>Visitante</h2><p>Para quem não está na relação dos 2.234.</p>'+
    '<input id="s-nm" placeholder="Nome completo" value="'+esc(d?'':(pre||''))+'">'+
    '<input id="s-cp" type="tel" inputmode="numeric" placeholder="CPF" value="'+esc(d?pre:'')+'">'+
    '<input id="s-tl" type="tel" inputmode="numeric" placeholder="Celular com DDD">'+
    '<div class="acts"><button class="sec" id="s-c">Cancelar</button>'+
    '<button class="pri" id="s-a">Adicionar e marcar</button></div>';
  abrir(); setTimeout(()=>$('s-nm').focus(),120);
  $('s-c').onclick=fechar;
  $('s-a').onclick=()=>{
    const nm=$('s-nm').value.trim(); if(!nm){toast('Escreva o nome');return}
    const id=900000+state.extra.length;
    state.extra.push({id,nome:nm,cpf:$('s-cp').value.replace(/\D/g,''),tel:$('s-tl').value.replace(/\D/g,'')});
    fechar(); $('q').value=''; busca=''; marcar(id);
  };
}
function confirmar(t,d,sim,nao,fn){
  $('sheet').innerHTML='<h2>'+t+'</h2><p>'+d+'</p><div class="acts">'+
    '<button class="sec" id="s-n">'+nao+'</button><button class="pri" id="s-y">'+sim+'</button></div>';
  abrir(); $('s-n').onclick=fechar; $('s-y').onclick=()=>{fechar();fn()};
}
function abrir(){$('veil').classList.add('show')}
function fechar(){$('veil').classList.remove('show')}
$('veil').onclick=e=>{if(e.target===$('veil'))fechar()};
$('b-add').onclick=()=>abrirNovo('');

let tt;
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),2200)}

$('b-save').onclick=()=>{
  const pack={app:'sentinelas-checkin',v:2,evento:state.ev,operador:state.op,
    gerado:new Date().toISOString(),presencas:state.pres,visitantes:state.extra};
  const nome='chamada_'+norm(state.ev).replace(/[^a-z0-9]+/g,'-')+'_'+norm(state.op).replace(/[^a-z0-9]+/g,'-')+'.json';
  const b=new Blob([JSON.stringify(pack)],{type:'application/json'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u;a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
  toast(Object.keys(state.pres).length+' presenças salvas em '+nome);
};
window.addEventListener('beforeunload',e=>{
  if(Object.keys(state.pres).length){e.preventDefault();e.returnValue=''}
});
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
